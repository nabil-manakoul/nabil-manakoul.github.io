  <g stroke="#8fa3b3" stroke-width="4" stroke-linecap="round"><path d="M56 46 h40"/><path d="M56 60 l30 0"/><path d="M56 74 h50"/></g>
  <g fill="#f6a821"><circle cx="130" cy="50" r="8"/><circle cx="130" cy="72" r="8"/></g>
