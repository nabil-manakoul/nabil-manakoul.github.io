<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" aria-label="تسيير المقاولات">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b8fb3"/><stop offset="1" stop-color="#1f6f8b"/></linearGradient>
    <linearGradient id="g1b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf6fa"/><stop offset="1" stop-color="#cfe6ef"/></linearGradient>
  </defs>
  <rect width="460" height="300" fill="url(#g1)"/>
  <circle cx="70" cy="60" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="400" cy="250" r="120" fill="#ffffff" opacity="0.06"/>
  <!-- dashboard card -->
  <rect x="70" y="70" width="230" height="160" rx="12" fill="url(#g1b)"/>
  <!-- bars -->
  <g>
    <rect x="92" y="150" width="26" height="60" rx="4" fill="#1f6f8b"/>
    <rect x="128" y="120" width="26" height="90" rx="4" fill="#2b8fb3"/>
    <rect x="164" y="135" width="26" height="75" rx="4" fill="#f6a821"/>
    <rect x="200" y="100" width="26" height="110" rx="4" fill="#2f7d49"/>
  </g>
  <!-- trend line -->
  <polyline points="92,140 128,120 164,128 200,96 236,84" fill="none" stroke="#c96a54" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="236" cy="84" r="6" fill="#c96a54"/>
  <!-- coins -->
  <g transform="translate(330 150)">
    <ellipse cx="0" cy="40" rx="46" ry="16" fill="#f6a821"/>
    <ellipse cx="0" cy="26" rx="46" ry="16" fill="#ffcf6b"/>
    <ellipse cx="0" cy="12" rx="46" ry="16" fill="#f6a821"/>
    <ellipse cx="0" cy="12" rx="46" ry="16" fill="none" stroke="#d98b1e" stroke-width="2"/>
    <text x="0" y="18" font-size="18" text-anchor="middle" fill="#8a5a12" font-family="Arial" font-weight="bold">DH</text>
  </g>
  <!-- briefcase -->
  <g transform="translate(320 60)">
    <rect x="-34" y="0" width="68" height="46" rx="7" fill="#eaf6fa"/>
    <rect x="-16" y="-10" width="32" height="14" rx="4" fill="none" stroke="#eaf6fa" stroke-width="5"/>
    <line x1="-34" y1="20" x2="34" y2="20" stroke="#1f6f8b" stroke-width="3"/>
  </g>
</svg>
