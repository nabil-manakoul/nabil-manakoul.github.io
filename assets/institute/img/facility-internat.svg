    <rect x="60" y="70" width="150" height="14" rx="4" fill="#7a4a2b"/>
    <rect x="60" y="150" width="150" height="14" rx="4" fill="#7a4a2b"/>
    <rect x="56" y="60" width="10" height="140" rx="4" fill="#5a3721"/>
