  <line x1="295" y1="120" x2="295" y2="200" stroke="#cdd9e2" stroke-width="3"/>
  <circle cx="285" cy="160" r="4" fill="#1f6f8b"/><circle cx="305" cy="160" r="4" fill="#1f6f8b"/>
