<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="الداخلية">
  <defs><linearGradient id="in1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf1f6"/><stop offset="1" stop-color="#d6e3ec"/></linearGradient>
  <linearGradient id="in2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b8fb3"/><stop offset="1" stop-color="#1f6f8b"/></linearGradient></defs>
  <rect width="400" height="260" fill="url(#in1)"/>
  <rect x="0" y="196" width="400" height="64" fill="#cddbe6"/>
  <!-- bunk bed -->
