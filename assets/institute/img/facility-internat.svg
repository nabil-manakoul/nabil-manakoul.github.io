    <!-- mattresses & pillows -->
    <rect x="66" y="56" width="140" height="16" rx="6" fill="#ffffff" stroke="#cdd9e2"/>
    <rect x="70" y="50" width="40" height="12" rx="6" fill="url(#in2)"/>
    <rect x="66" y="136" width="140" height="16" rx="6" fill="#ffffff" stroke="#cdd9e2"/>
